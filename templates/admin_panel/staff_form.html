{% extends 'admin_panel/base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="form-page">
    <a href="{% url 'admin_panel:staff_list' %}" class="btn-back"><i class="bi bi-arrow-left"></i> Back</a>
    <div class="card-panel">
        <div class="panel-header"><h3><i class="bi bi-person-plus-fill"></i> {{ title }}</h3></div>
        <div class="panel-body">
            <form method="post" class="styled-form">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" name="name" value="{{ staff.name|default:'' }}" class="form-input-dark" required>
                    </div>
                    <div class="form-group">
                        <label>Role *</label>
                        <select name="role" class="form-select-dark" required>
                            {% for val, label in roles %}
                            <option value="{{ val }}" {% if staff.role == val %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" name="phone" value="{{ staff.phone|default:'' }}" class="form-input-dark">
                    </div>
                    <div class="form-group">
                        <label>Login PIN * <small>(4-6 digits)</small></label>
                        <input type="text" name="pin" value="{{ staff.pin|default:'' }}" class="form-input-dark" maxlength="6" pattern="[0-9]{4,6}" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="is_active" {% if not staff or staff.is_active %}checked{% endif %}>
                        <span>Active Staff</span>
                    </label>
                </div>
                <div class="form-actions">
                    <a href="{% url 'admin_panel:staff_list' %}" class="btn-secondary">Cancel</a>
                    <button type="submit" class="btn-primary">Save Staff</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
