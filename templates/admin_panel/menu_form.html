{% extends 'admin_panel/base.html' %}
{% block page_title %}{{ title }}{% endblock %}
{% block header_title %}{{ title }}{% endblock %}

{% block content %}
<div class="form-page">
    <a href="{% url 'admin_panel:menu_list' %}" class="btn-back"><i class="bi bi-arrow-left"></i> Back to Menu</a>
    <div class="card-panel">
        <div class="panel-header"><h3><i class="bi bi-menu-button-wide-fill"></i> {{ title }}</h3></div>
        <div class="panel-body">
            <form method="post" enctype="multipart/form-data" class="styled-form">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group">
                        <label>Item Name *</label>
                        <input type="text" name="name" value="{{ item.name|default:'' }}" class="form-input-dark" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select name="category" class="form-select-dark" required>
                            <option value="">-- Select Category --</option>
                            {% for cat in categories %}
                            <option value="{{ cat.pk }}" {% if item and item.category.pk == cat.pk %}selected{% endif %}>{{ cat.icon }} {{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Price (₹) *</label>
                        <input type="number" name="price" value="{{ item.price|default:'' }}" class="form-input-dark" step="0.01" required min="0">
                    </div>
                    <div class="form-group">
                        <label>Preparation Time (minutes)</label>
                        <input type="number" name="preparation_time" value="{{ item.preparation_time|default:15 }}" class="form-input-dark" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" class="form-textarea-dark" rows="3">{{ item.description|default:'' }}</textarea>
                </div>
                <div class="form-group">
                    <label>Image</label>
                    {% if item and item.image %}
                    <div class="current-image">
                        <img src="{{ item.image.url }}" alt="Current image" style="width:80px;border-radius:8px;">
                    </div>
                    {% endif %}
                    <input type="file" name="image" class="form-input-dark" accept="image/*">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="is_available" {% if not item or item.is_available %}checked{% endif %}>
                            <span>Available for ordering</span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="is_veg" {% if not item or item.is_veg %}checked{% endif %}>
                            <span>🟢 Vegetarian</span>
                        </label>
                    </div>
                </div>
                <div class="form-actions">
                    <a href="{% url 'admin_panel:menu_list' %}" class="btn-secondary">Cancel</a>
                    <button type="submit" class="btn-primary">Save Item</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
